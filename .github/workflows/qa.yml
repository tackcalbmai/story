name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f _headers
          test -f robots.txt
      - name: No accidental indexing
        run: |
          grep -q 'noindex' index.html
          grep -q 'Disallow: /' robots.txt
      - name: Story hooks present
        run: |
          grep -q 'И так' index.html
          grep -q 'НЕЕЕТ' index.html
          grep -q 'ПОДАЧА' index.html
          grep -q 'Вечная зима' index.html
          grep -q 'Это же общее желание' index.html
